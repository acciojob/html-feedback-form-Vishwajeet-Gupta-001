<!DOCTYPE html>

<html>

<head>
	<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        form {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            margin: 10px 0 20px;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->

	<form method="POST">

        <h1>Feedback Form</h1>

        <!-- Name -->
        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            minlength="3"
            maxlength="50"
            required
        >

        <br>

        <!-- Portfolio -->
        <label for="portfolio">Portfolio</label>
        <input
            type="url"
            id="portfolio"
            required
        >

        <br>

        <!-- Favorite Color -->
        <label for="favColor">Favorite Color</label>
        <input
            type="color"
            id="favColor"
        >

        <br>

        <!-- Likeness -->
        <label for="likeness">Likeness</label>
        <input
            type="range"
            id="likeness"
            min="1"
            max="100"
        >

        <br><br>

        <button type="submit">Submit</button>

    </form>
	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
